name: Build OnePlus 15 kernel (scheme A = NoMount)

on:
  # Every 3 days at 20:00 UTC: check the upstreams, build and release only when something changed
  schedule:
    - cron: "0 20 */3 * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (boot.img + AnyKernel3 zip + Image)"
        type: boolean
        default: true
      stock_boot_url:
        description: "Optional: direct download URL of a stock boot.img (empty = asset boot.img of the 'stock-boot' release)"
        default: ""
      ksu_ref:
        description: "tiann/KernelSU branch/tag/commit (main = latest; auto-falls back to the SUSFS sync point if the SUSFS patch does not apply)"
        default: "main"
      susfs_ref:
        description: "susfs4ksu branch/commit (gki-android16-6.12 = latest; v2.2.0 = f37930f374ef88de990d6abea0c67d0ea28c1edc)"
        default: "gki-android16-6.12"
      nomount_ref:
        description: "NoMount tag/commit (empty = latest tag)"
        default: ""
      bbg_ref:
        description: "Baseband-guard commit or tag (empty = main)"
        default: ""
      kernel_release:
        description: "Stock `uname -r` to spoof (empty = repo variable KERNEL_RELEASE, else the 16.0.10.601 value)"
        default: ""
      build_timestamp:
        description: "Stock time from `uname -v` (empty = repo variable BUILD_TIMESTAMP, else the 16.0.10.601 value)"
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-build
  cancel-in-progress: false

env:
  # Stock values of CPH2747_16.0.10.601(EX01); after a firmware update set the repository
  # variables KERNEL_RELEASE / BUILD_TIMESTAMP (Settings > Secrets and variables > Actions > Variables)
  KERNEL_RELEASE: ${{ inputs.kernel_release || vars.KERNEL_RELEASE || '6.12.58-android16-6-g925a103d123c-ab15898589-4k' }}
  BUILD_TIMESTAMP: ${{ inputs.build_timestamp || vars.BUILD_TIMESTAMP || 'Mon Jul 20 17:37:05 UTC 2026' }}
  KSU_REF: ${{ inputs.ksu_ref || 'main' }}
  SUSFS_REF: ${{ inputs.susfs_ref || 'gki-android16-6.12' }}

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep the source fork in sync with OnePlusOSS
        env:
          # Optional secret: a fine-grained token with Contents read/write on your
          # android_kernel_common_oneplus_sm8850 fork. Without it the fork is only checked.
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BR=oneplus/sm8850_b_16.0.0_oneplus_15
          up=$(git ls-remote https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8850.git "refs/heads/$BR" | cut -f1)
          fk=$(git ls-remote "https://github.com/$OWNER/android_kernel_common_oneplus_sm8850.git" "refs/heads/$BR" 2>/dev/null | cut -f1 || true)
          if [ -z "$fk" ]; then
            echo "No fork under $OWNER, the build uses OnePlusOSS directly."
          elif [ "$fk" = "$up" ]; then
            echo "Fork is up to date ($up)."
          elif [ -n "$SYNC_TOKEN" ]; then
            GH_TOKEN="$SYNC_TOKEN" gh api -X POST "repos/$OWNER/android_kernel_common_oneplus_sm8850/merge-upstream" -f branch="$BR" \
              && echo "Fork synced with OnePlusOSS." \
              || echo "::warning::Could not sync the fork automatically; press Sync fork on GitHub."
          else
            echo "::warning::Your fork $OWNER/android_kernel_common_oneplus_sm8850 is behind OnePlusOSS. Press Sync fork, or add a SYNC_TOKEN secret to sync automatically."
          fi

      - name: Compare with the latest release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          bash scripts/upstream.sh > upstream.txt
          cat upstream.txt
          last=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName,createdAt \
                   --jq '[.[] | select(.tagName | startswith("op15-"))] | sort_by(.createdAt) | last | .tagName // ""')
          echo "latest release: ${last:-none}"
          : > prev.txt
          if [ -n "$last" ]; then
            gh release download "$last" -R "$GITHUB_REPOSITORY" -p upstream.txt -O prev.txt --clobber 2>/dev/null || : > prev.txt
          fi
          {
            echo "### 上游"
            echo
            echo "| 组件 | 上次发布 | 现在 |"
            echo "|---|---|---|"
            while IFS=': ' read -r k v; do
              o=$(sed -n "s|^$k: ||p" prev.txt)
              mark=""; [ "$o" != "$v" ] && mark=" **(更新)**"
              echo "| $k | \`${o:-—}\` | \`$v\`$mark |"
            done < upstream.txt
          } > changes.md
          cat changes.md >> "$GITHUB_STEP_SUMMARY"
          new_br=$(sed -n 's/^oneplus15_branches: //p' upstream.txt | tr ' ' '\n' | grep -vx 'oneplus/sm8850_b_16.0.0_oneplus_15' || true)
          if [ -n "$new_br" ]; then
            echo "::warning::OnePlusOSS has another OnePlus 15 kernel branch: $new_br (new firmware base?). The build still uses oneplus/sm8850_b_16.0.0_oneplus_15."
          fi
          if [ "$EVENT" != schedule ]; then
            echo "Manual run: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ ! -s prev.txt ] || ! diff -q <(grep -v '^oneplus15_branches' prev.txt) <(grep -v '^oneplus15_branches' upstream.txt) >/dev/null; then
            echo "Upstream changed: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream change since $last: skipping the build." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: upstream
          path: |
            upstream.txt
            changes.md

  build:
    name: Build scheme A
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio zip unzip lz4 zstd python3 git curl rsync \
            libssl-dev libelf-dev libdw-dev libncurses-dev dwarves patch cmake zlib1g-dev ccache

      # Ubuntu 24.04 ships pahole 1.25, which caps per-CPU vars at 4096 and emits a
      # broken BTF for this kernel ("FAILED: load BTF from vmlinux"). Build a newer one
      # once and keep it in the Actions cache.
      - name: Restore pahole v1.30
        id: pahole
        uses: actions/cache@v4
        with:
          path: ~/pahole
          key: pahole-v1.30-ubuntu-24.04

      - name: Build pahole v1.30
        if: steps.pahole.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -b v1.30 \
            https://github.com/acmel/dwarves.git /tmp/dwarves
          cmake -S /tmp/dwarves -B /tmp/dwarves/build -D__LIB=lib -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/pahole" -DCMAKE_INSTALL_RPATH="$HOME/pahole/lib"
          make -C /tmp/dwarves/build -j"$(nproc)" install

      - name: Use pahole v1.30
        run: |
          echo "$HOME/pahole/bin" >> "$GITHUB_PATH"
          "$HOME/pahole/bin/pahole" --version

      # The clang/rust/bindgen prebuilts (~5.5 GB) come from CodeLinaro at the revisions
      # pinned in OnePlus' manifest; cache them under a key made of those revisions.
      - name: Toolchain cache key
        id: tc
        run: |
          curl -fsSL --retry 5 https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/oneplus/sm8850/oneplus_15.xml -o /tmp/manifest.xml
          curl -fsSL --retry 5 "https://raw.githubusercontent.com/OnePlusOSS/android_kernel_common_oneplus_sm8850/oneplus/sm8850_b_16.0.0_oneplus_15/build.config.constants" -o /tmp/constants || : > /tmp/constants
          key=$( { grep -E 'prebuilts-master/clang/host/linux-x86|prebuilts/rust"|prebuilts/clang-tools"' /tmp/manifest.xml; \
                   grep -E '^(CLANG|RUSTC)_VERSION' /tmp/constants; } | sha256sum | cut -c1-16)
          echo "key=tc-$key" >> "$GITHUB_OUTPUT"
          echo "toolchain key: tc-$key"

      - name: Restore toolchain
        id: tc_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/tc
          key: ${{ steps.tc.outputs.key }}

      # ccache of the kernel objects: a new entry per run, restored from the newest one
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-op15-${{ github.run_id }}
          restore-keys: ccache-op15-

      - name: Get stock boot.img
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
        run: |
          mkdir -p stock
          if [ -n "$STOCK_BOOT_URL" ]; then
            curl -fL --retry 3 -o stock/boot.img "$STOCK_BOOT_URL" || echo "::warning::could not download stock_boot_url"
          elif gh release view stock-boot -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download stock-boot -R "$GITHUB_REPOSITORY" -p 'boot.img' -D stock || echo "::warning::stock-boot release has no boot.img asset"
          fi
          if [ -s stock/boot.img ]; then
            echo "STOCK_BOOT=$PWD/stock/boot.img" >> "$GITHUB_ENV"
            ls -l stock/boot.img
          else
            echo "::warning::No stock boot.img found; boot.img will not be built. Upload one as asset 'boot.img' to a release tagged 'stock-boot'."
          fi

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEME: A
          SRC_OWNER: ${{ github.repository_owner }}
          BBG_REF: ${{ inputs.bbg_ref }}
          NOMOUNT_REF: ${{ inputs.nomount_ref }}
          CCACHE_MAXSIZE: 3G
        run: |
          export TC_DIR="$HOME/tc" CCACHE_DIR="$HOME/.ccache"
          bash scripts/build.sh

      # Saved even when the build fails, so a retry does not download 5.5 GB again
      - name: Save toolchain
        if: always() && steps.tc_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tc
          key: ${{ steps.tc.outputs.key }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-op15-${{ github.run_id }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP15-scheme-A
          path: dist/
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'schedule' || inputs.release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN: ${{ github.run_number }}
        run: |
          shopt -s nullglob
          img=(artifacts/Image_*schemeA_*)
          [ -e "${img[0]:-/nonexistent}" ] || { echo "::warning::No Image produced, not releasing."; exit 0; }
          files=(artifacts/boot_*schemeA_*.img artifacts/AnyKernel3_*schemeA_*.zip "${img[@]}" \
                 artifacts/build-info_schemeA.txt artifacts/kernel_schemeA.config artifacts/upstream.txt)
          KREL="$(sed -n 's/^kernelrelease *: //p' artifacts/build-info_schemeA.txt | head -n1)"
          TAG="op15-$(date -u +%Y%m%d)-r${RUN}"
          {
            echo "OnePlus 15 · Linux ${KREL} · 方案 A（NoMount 内置，SUSFS OPEN_REDIRECT 关）"
            echo
            if [ "$EVENT" = schedule ]; then echo "定时编译：每 3 天检查一次上游，有更新才编。"; echo; fi
            echo "文件: \`boot_*.img\` (fastboot flash boot), \`AnyKernel3_*.zip\` (管理器/Recovery 卡刷), \`Image_*\` (单独内核)."
            echo
            echo "**刷机前请备份原厂 boot.img。** 自动编译的版本没有经过真机测试；真机验证过的 boot 在仓库的 \`boot/\` 目录。"
            echo
            cat artifacts/changes.md 2>/dev/null || true
            echo; echo '```'; cat artifacts/build-info_schemeA.txt; echo '```'
          } > notes.md
          gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --title "OnePlus 15 ${KREL} (${RUN})" --notes-file notes.md
