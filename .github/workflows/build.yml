name: Build OnePlus 15 kernel (A=NoMount / B=OverlayFS)

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "A = NoMount, B = OverlayFS, both = build both"
        type: choice
        options: [both, A, B]
        default: both
      release:
        description: "Publish a GitHub Release (boot.img + AnyKernel3 zip + Image)"
        type: boolean
        default: true
      stock_boot_url:
        description: "Optional: direct download URL of a stock boot.img (empty = use asset boot.img from the 'stock-boot' release of this repo)"
        default: ""
      ksu_ref:
        description: "tiann/KernelSU branch/tag/commit (main = latest; auto-falls back to the SUSFS sync point if the SUSFS patch does not apply)"
        default: "main"
      susfs_ref:
        description: "susfs4ksu branch/commit (gki-android16-6.12 = latest; v2.2.0 = f37930f374ef88de990d6abea0c67d0ea28c1edc)"
        default: "gki-android16-6.12"
      nomount_ref:
        description: "NoMount tag/commit for scheme A (empty = latest tag)"
        default: ""
      bbg_ref:
        description: "Baseband-guard commit or tag (empty = main)"
        default: ""
      kernel_release:
        description: "Optional: stock `uname -r` from your phone, e.g. 6.12.58-android16-6-o-gxxxxxxxxxxx-4k (empty = do not spoof)"
        default: ""
      build_timestamp:
        description: "Optional: stock build time from `uname -v`, e.g. 'Tue Nov  4 08:00:00 UTC 2026'"
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Scheme ${{ matrix.scheme }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scheme: ${{ fromJSON(inputs.scheme == 'both' && '["A","B"]' || format('["{0}"]', inputs.scheme)) }}
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio zip unzip lz4 zstd python3 git curl rsync \
            libssl-dev libelf-dev libdw-dev libncurses-dev dwarves patch cmake zlib1g-dev

      # Ubuntu 24.04 ships pahole 1.25, which caps per-CPU vars at 4096 and emits a
      # broken BTF for this kernel ("FAILED: load BTF from vmlinux"). Build a newer one.
      - name: Build pahole v1.30
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -b v1.30 \
            https://github.com/acmel/dwarves.git /tmp/dwarves
          cmake -S /tmp/dwarves -B /tmp/dwarves/build -D__LIB=lib \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release
          sudo make -C /tmp/dwarves/build -j"$(nproc)" install
          sudo ldconfig
          hash -r
          which pahole
          pahole --version

      - name: Get stock boot.img
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
        run: |
          mkdir -p stock
          if [ -n "$STOCK_BOOT_URL" ]; then
            curl -fL --retry 3 -o stock/boot.img "$STOCK_BOOT_URL" || echo "::warning::could not download stock_boot_url"
          elif gh release view stock-boot -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download stock-boot -R "$GITHUB_REPOSITORY" -p 'boot.img' -D stock || echo "::warning::stock-boot release has no boot.img asset"
          fi
          if [ -s stock/boot.img ]; then
            echo "STOCK_BOOT=$PWD/stock/boot.img" >> "$GITHUB_ENV"
            ls -l stock/boot.img
          else
            echo "::warning::No stock boot.img found; boot.img will not be built. Upload one as asset 'boot.img' to a release tagged 'stock-boot'."
          fi

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEME: ${{ matrix.scheme }}
          SRC_OWNER: ${{ github.repository_owner }}
          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS_REF: ${{ inputs.susfs_ref }}
          BBG_REF: ${{ inputs.bbg_ref }}
          NOMOUNT_REF: ${{ inputs.nomount_ref }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
          BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
        run: bash scripts/build.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP15-6.12.58-scheme-${{ matrix.scheme }}
          path: dist/
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: ${{ !cancelled() && inputs.release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # A build-info file is written ONLY after that scheme's Image is produced,
          # so its presence means that scheme compiled successfully. Release only those.
          ok_schemes=""
          files=()
          for info in artifacts/build-info_scheme*.txt; do
            s="$(sed -n 's/.*build-info_scheme\(.\)\.txt/\1/p' <<<"$info")"
            img=(artifacts/Image_*scheme${s}_*)
            [ -e "${img[0]:-/nonexistent}" ] || { echo "scheme $s: no Image, skipping"; continue; }
            ok_schemes="$ok_schemes $s"
            files+=(artifacts/boot_*scheme${s}_*.img artifacts/AnyKernel3_*scheme${s}_*.zip \
                    artifacts/Image_*scheme${s}_* "$info" artifacts/kernel_scheme${s}.config)
          done
          if [ -z "$ok_schemes" ]; then
            echo "::warning::No scheme compiled successfully — not creating a release."
            exit 0
          fi
          echo "Releasing schemes:$ok_schemes"
          KREL="$(sed -n 's/^kernelrelease *: //p' artifacts/build-info_scheme*.txt | head -n1)"
          TAG="op15-$(date -u +%Y%m%d)-r${{ github.run_number }}"
          {
            echo "OnePlus 15 · Linux ${KREL}"
            echo
            echo "编译成功并发布的方案:**$ok_schemes**（只发布实际编译成功的方案）"
            case "$ok_schemes" in *A*) echo "- **方案 A (NoMount)**: NoMount 内置, SUSFS OPEN_REDIRECT 关";; esac
            case "$ok_schemes" in *B*) echo "- **方案 B (OverlayFS)**: OverlayFS 内置, SUSFS OPEN_REDIRECT 开";; esac
            echo
            echo "每个方案的文件: \`boot_*.img\` (fastboot flash boot), \`AnyKernel3_*.zip\` (管理器/Recovery 卡刷), \`Image_*\` (单独内核)."
            echo "**刷机前请备份原厂 boot.img。**"
            for f in artifacts/build-info_scheme*.txt; do
              echo; echo '```'; cat "$f"; echo '```'
            done
          } > notes.md
          gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --title "OnePlus 15 ${KREL} (${{ github.run_number }})" --notes-file notes.md
